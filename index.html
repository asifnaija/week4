<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Library Book Tracker</title>
    <link rel="stylesheet" href="styles/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>School Library Book Tracker</h1>
        <p class="subtitle">Manage Your Library Collection</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Add New Book</h2>
            <form id="bookForm" class="book-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre" name="genre" required>
                        <option value="">Select a genre</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Textbook">Textbook</option>
                        <option value="Reference">Reference</option>
                        <option value="Biography">Biography</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="Available">Available</option>
                        <option value="Borrowed">Borrowed</option>
                        <option value="Reserved">Reserved</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">
                    <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Add Book
                </button>
            </form>
        </section>

        <section class="book-list-section">
            <div class="filters">
                <h2>Book Collection</h2>
                <div class="filter-buttons">
                    <button class="btn btn-filter active" data-filter="all">All Books</button>
                    <button class="btn btn-filter" data-filter="Available">
                        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12l5 5L20 7"/>
                        </svg>
                        Available
                    </button>
                    <button class="btn btn-filter" data-filter="Fiction">Fiction</button>
                    <button class="btn btn-filter" data-filter="Non-Fiction">Non-Fiction</button>
                    <button class="btn btn-filter" data-filter="Textbook">Textbook</button>
                </div>
                <div class="stats">
                    <span id="totalBooks">0</span> books in total • 
                    <span id="availableBooks">0</span> available
                </div>
            </div>

            <div class="book-list" id="bookList">
                <!-- Books will be dynamically added here -->
                <div class="empty-state">
                    <svg class="empty-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zM12 8v8M8 12h8"/>
                    </svg>
                    <p>No books added yet. Add your first book to get started!</p>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
